<template id="tpl-about">
  <div class="win-body prose">
    <p class="lead">I lead the teams and systems that keep enterprise IT secure, compliant, and always on — from identity to endpoints to the cloud.</p>
    <p>I'm an IT Infrastructure, Operations &amp; Security professional with 8+ years across enterprise IT support, system administration, cloud/SaaS administration, IAM, endpoint security, ITSM, network infrastructure, and IT governance. I now work in a Team Lead capacity — coordinating day-to-day operations, incident priorities, escalations, SLA performance, and technical support for the team.</p>
    <p>Day to day I own IAM (Okta SSO/MFA, Active Directory), endpoint security across 500+ machines (NinjaOne, CrowdStrike EDR, Webroot), <strong>ITSM and change management</strong> in Jira, and multi-site network &amp; virtualization (Vizag, Hyderabad, HQ, SOC — Proxmox, PRTG, Firewall Administration). I also support SOC audits, license/vendor governance, and cloud/SaaS reviews across Microsoft 365, Google Workspace, and the wider enterprise app stack.</p>
    <div class="kv-grid">
      <div class="kv"><span class="k">Location</span><span class="v">Visakhapatnam, India</span></div>
      <div class="kv"><span class="k">Role</span><span class="v">Team Lead — IT Infrastructure &amp; Operations</span></div>
      <div class="kv"><span class="k">Focus</span><span class="v">IAM · Endpoint · ITSM · Network</span></div>
      <div class="kv"><span class="k">Availability</span><span class="v">Open to roles</span></div>
    </div>
  </div>
</template>
